# Ring Bonuses display
[[patches]] 
[patches.pattern]
target = '''functions/common_events.lua'''
pattern = '''if not hide_desc and card and card.ability and (card.ability.extra_slots_used or 0) ~= 0 then'''
position = "before"
payload = '''
if ((_c.set == 'Planet' or _c.show_ring_display) and not _c.no_ring_display) and first_pass then
	for k, v in pairs(G.GAME.may_ring_bonuses or {}) do
		if type(v) == 'number' and (v or 0) > 0 then 
			info_queue[#info_queue + 1] = { key = "may_ring_bonus", set = "Other", vars = {
				(G.GAME.may_ring_bonuses.chips or 0),
				(G.GAME.may_ring_bonuses.mult or 0),
				(G.GAME.may_ring_bonuses.lev_chips or 0),
				(G.GAME.may_ring_bonuses.lev_mult or 0),
				(G.GAME.may_ring_bonuses.dollars or 0),
				(G.GAME.may_ring_bonuses.score or 0),
				(G.GAME.may_ring_bonuses.levels or 0),
			 } }
			break
		end
	end
end
if #info_queue > 0 then 
	local to_delete = {} 
	for k, v in pairs(info_queue) do 
		if v.key and string.sub(v.key, -8, -1) == 'tutorial' and string.sub(v.key, 1, 4) == 'may_' then
			if not may.conf.tutorial_tooltips then 
				table.insert(to_delete, k) 
			end
		end
	end 
	if #to_delete > 0 then 
		for k, v in pairs(to_delete) do
			table.remove(info_queue, v) 
		end
	end
end
'''
match_indent = true

