# Prevent background weirdness when inside a pack during a blind
[[patches]] 
[patches.pattern]
target = '''game.lua'''
pattern = '''ease_background_colour_blind(G.STATES.DRAW_TO_HAND)'''
position = "at"
payload = '''
    if not G.pack_cards then
	    ease_background_colour_blind(G.STATES.DRAW_TO_HAND)
	end
'''
match_indent = true

