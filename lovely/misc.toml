# Make Cryptid Redeemed Deck not give Transcend Vouchers
[[patches]]
[patches.pattern]
target = '''=[SMODS Cryptid "items/deck.lua"]'''
pattern = "if vv == self.config.center.key then"
position = "at"
payload = '''if vv == self.config.center.key and v.key ~= 'v_may_transcend_1' and v.key ~= 'v_may_transcend_2' then'''
match_indent = true

# Enter shop context
# Taken from MoreFluff
[[patches]]
[patches.pattern]
target = 'game.lua'
match_indent = true
pattern = '''
    for i = 1, #G.GAME.tags do
        G.GAME.tags[i]:apply_to_run({type = 'voucher_add'})
    end
'''
position = 'after'
payload = '''
    SMODS.calculate_context({ may_enter_shop = true, main_eval = true })
    for i = 1, (G.GAME.may_mega_boosters or 0) do 
        SMODS.add_booster_to_shop('p_buffoon_mega_1')
    end
	may.handle_special_vouchers()
'''

# why
